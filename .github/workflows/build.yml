name: build
run-name: "build: ${{ inputs.name || github.ref_name }}"

# Started by hand: a release build of the daemon, the Debian package, and the
# SDK -- the shared library with its header in the usual lib/ and include/
# layout -- kept as artifacts. Nothing here runs on a push; ci.yml is what
# every push gets.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "What this build is for; it names the run"
        required: false
        default: ""
      deb_version:
        description: "Package version (e.g. 0.1.0~pre1-1); the crate's when empty"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: release binary and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The artifacts are named by the short commit; there is no expression
      # for a prefix of the full one.
      - name: Short commit
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # The build itself needs nothing graphical: every encoder and graphics
      # interface is loaded at runtime. cargo-deb is the one tool on top.
      - uses: taiki-e/install-action@cargo-deb

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release -p lowlatd -p lowlat-sdk

      # **The header ships as committed, not regenerated here.** The ABI gate
      # in ci.yml is what proves the committed header matches the definitions
      # in the same commit, so this takes the file the gate passed.
      - name: Assemble the SDK
        run: |
          sdk=lowlat-sdk-linux-x86_64-${{ steps.sha.outputs.short }}
          mkdir -p "$sdk/lib" "$sdk/include"
          cp target/release/liblowlat.so "$sdk/lib/"
          strip --strip-debug "$sdk/lib/liblowlat.so"
          cp include/lowlat.h "$sdk/include/"
          cp LICENSE docs/06-api.md "$sdk/"
          tar -czf "$sdk.tar.gz" "$sdk"
          ls -la "$sdk"/lib "$sdk"/include
          nm -D --defined-only "$sdk/lib/liblowlat.so" | grep -c ' lowlat_'

      - name: Package
        run: |
          if [ -n "${{ inputs.deb_version }}" ]; then
            cargo deb -p lowlatd --no-build --deb-version "${{ inputs.deb_version }}"
          else
            cargo deb -p lowlatd --no-build
          fi
          ls -la target/debian/

      - name: Describe
        run: |
          target/release/lowlatd --outputs || true
          dpkg-deb -I target/debian/lowlat_*.deb

      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: lowlatd-linux-x86_64-${{ steps.sha.outputs.short }}
          path: target/release/lowlatd
          if-no-files-found: error

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: lowlat-deb-${{ steps.sha.outputs.short }}
          path: target/debian/lowlat_*.deb
          if-no-files-found: error

      - name: Upload the SDK
        uses: actions/upload-artifact@v4
        with:
          name: lowlat-sdk-linux-x86_64-${{ steps.sha.outputs.short }}
          path: lowlat-sdk-linux-x86_64-${{ steps.sha.outputs.short }}.tar.gz
          if-no-files-found: error

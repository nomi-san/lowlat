name: ci

on:
  push:
    branches:
      - main
      - feat/*
      - fix/*
      - release/*
      - pre/*
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: format, lints, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: rustup component add rustfmt clippy

      # The colour conversion is checked against a reference computed on the
      # processor, and that check runs on the software driver rather than
      # needing a graphics card. It is the only thing that catches a wrong
      # colour matrix: comparing a converted desktop against its source is
      # nearly blind to one, because a desktop is mostly grey and a grey pixel
      # carries no colour for a matrix to act on.
      # The rest is for the demo below: the toolkit's shader compiler, since
      # its shader headers are made at build time rather than committed, and
      # the three libraries whose headers it compiles against -- it opens
      # every library at run time, but these three it declares from the
      # system's own headers.
      - name: Install a graphics driver for the conversion test
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libegl1 libgl1-mesa-dri libgbm1 vulkan-tools \
            glslang-tools bsdextrautils libasound2-dev libpng-dev libjpeg-dev

      # What the software driver on this runner offers, in the log, so a test
      # refused an interface can be read against the driver rather than
      # guessed at.
      - name: Describe the software driver
        run: |
          vulkaninfo --summary 2>/dev/null | grep -E 'deviceName|driverInfo|apiVersion' || true
          vulkaninfo 2>/dev/null | grep -E 'VK_EXT_image_drm_format_modifier|VK_EXT_external_memory_dma_buf|VK_KHR_external_memory_fd|VK_EXT_queue_family_foreign' | sort -u || true
          ls -la /dev/udmabuf /dev/dri 2>&1 || true

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # AGENTS.md 1: ASCII only, section sign excepted. Runs first because it
      # needs no toolchain and fails fast.
      - name: ASCII check
        run: python3 scripts/check-ascii.py

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Each half alone. Everything else here builds all features or the
      # defaults, under which a reference from one half into the other's
      # crates compiles; it is an error only when that other half is absent,
      # which is the build a platform that can only be a client makes.
      - name: Clippy, the client half alone
        run: cargo clippy -p lowlat-sdk --no-default-features --features client -- -D warnings

      - name: Clippy, the host half alone
        run: cargo clippy -p lowlat-sdk --no-default-features --features host -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

      # `--all-features` above turns on `gpl-libavcodec`, which a release
      # build never has: the codec library's licence rule as shipped, where
      # a GPL pair -- the runner's own, when it has one -- is refused.
      - name: Tests, the licence rule as shipped
        run: cargo test -p lowlat-drivers --lib lavc

      - name: Build release
        run: cargo build --workspace --release

      # The client-only library, copied out at once: it lands on the same
      # file the release build above wrote, and any later build would land on
      # it in turn, so nothing reads it from where cargo put it.
      - name: Build the client-only library
        run: |
          cargo build --release -p lowlat-sdk --no-default-features --features client
          mkdir -p "$RUNNER_TEMP/client-only/lib"
          cp target/release/liblowlat.so "$RUNNER_TEMP/client-only/lib/"
          if nm -D --defined-only "$RUNNER_TEMP/client-only/lib/liblowlat.so" | grep -q ' lowlat_host_'; then
            echo "a host symbol in the client-only library"; exit 1
          fi

      # The demo linked against that copy: the one thing that links the client
      # symbols the way an application does, so a name the client half lost
      # fails here, at the link, rather than in somebody's integration. A
      # feature bit only says which half was asked for.
      - name: Build the demo against the client-only library
        run: make -C examples/client LOWLAT_LIB="$RUNNER_TEMP/client-only/lib" client

      # The websocket reader the demo's signaling reads through, against a
      # loopback server that sends messages in fragments: only whole ones
      # may come out. Needs no network.
      - name: The toolkit's websocket reader
        run: make -C examples/client check

  # The crates with a Windows side, on Windows (docs/impl-plan-windows.md).
  # Per-platform code is a module of the same name on each platform rather
  # than a trait, so this build is the only thing holding the two sides to
  # one shape. The crates with no Windows side yet build empty there, which
  # keeps the whole workspace building; examples are left out, because the
  # ones there are probes of Linux hardware.
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: rustup component add clippy

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Clippy
        run: cargo clippy --workspace --lib --bins --tests -- -D warnings

      - name: Tests
        run: cargo test --workspace --lib --bins --tests

  loom:
    name: model checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # docs/08-testing.md 7: concurrency primitives are model checked, not
      # soak tested. This job is not optional.
      - name: Loom
        run: cargo test -p lowlat-common --lib --release
        env:
          RUSTFLAGS: --cfg loom
          LOOM_MAX_PREEMPTIONS: "3"

  deny:
    name: licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Run on the runner with the repository's own toolchain rather than in a
      # musl container: rust-toolchain.toml pins a target the container has no
      # toolchain for, which degrades dependency resolution before any policy
      # is even evaluated.
      - uses: taiki-e/install-action@cargo-deny
      - name: Deny
        run: cargo deny check

  sanitizers:
    name: sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly
        run: rustup toolchain install nightly --component rust-src

      # The conversion tests run on the software driver here as they do in the
      # check job; without it every one of them fails on an incompatible
      # driver before the sanitizer has anything to look at.
      - name: Install a graphics driver for the conversion test
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libegl1 libgl1-mesa-dri libgbm1

      # **Not the rate trajectories.** They are pure-Rust simulation of the
      # congestion controller and took forty-nine of this job's fifty-two
      # minutes sanitized, for code a memory sanitizer has nothing to say
      # about; the plain job runs them. The simulator's other targets are
      # cheap and drive the shell's real paths -- the browser pipe's record
      # layer, recovery -- so they stay, named because cargo cannot leave one
      # target of a crate out. A new target in that crate is added here.
      - name: Address sanitizer
        run: |
          cargo +nightly test --workspace --exclude lowlat-sim --all-features \
            -Z build-std --target x86_64-unknown-linux-gnu
          cargo +nightly test -p lowlat-sim --all-features \
            --lib --test netns --test recovery --test topology --test web_pair \
            -Z build-std --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: -Z sanitizer=address
          RUSTDOCFLAGS: -Z sanitizer=address
          # The software driver's own allocations, which it never frees; see
          # the file. Leak detection stays on for everything else.
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/lsan-suppressions.txt

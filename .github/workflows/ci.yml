name: ci

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: format, lints, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup component add rustfmt clippy

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # AGENTS.md 1: ASCII only, section sign excepted. Runs first because it
      # needs no toolchain and fails fast.
      - name: ASCII check
        run: python3 scripts/check-ascii.py

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Build release
        run: cargo build --workspace --release

  loom:
    name: model checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docs/08-testing.md 7: concurrency primitives are model checked, not
      # soak tested. This job is not optional.
      - name: Loom
        run: cargo test -p lowlat-common --lib --release
        env:
          RUSTFLAGS: --cfg loom
          LOOM_MAX_PREEMPTIONS: "3"

  deny:
    name: licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  sanitizers:
    name: sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly
        run: rustup toolchain install nightly --component rust-src

      - name: Address sanitizer
        run: |
          cargo +nightly test --workspace --all-features \
            -Z build-std --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: -Z sanitizer=address
          RUSTDOCFLAGS: -Z sanitizer=address

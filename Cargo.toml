[workspace]
resolver = "3"
members = [
    "crates/common",
    "crates/core",
    "crates/crypto",
    "crates/net",
    "crates/sim",
    "crates/capture",
    "crates/audio",
    "crates/encode",
    "crates/inject",
    "crates/host",
    "crates/kessel",
    "crates/daemon",
    "crates/tray",
]
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/nomi-san/lowlat"
authors = ["Nguyen Duy <wuuyi123@gmail.com>"]

[workspace.dependencies]
lowlat-common = { path = "crates/common" }
lowlat-core = { path = "crates/core" }
lowlat-crypto = { path = "crates/crypto" }
lowlat-net = { path = "crates/net" }
lowlat-sim = { path = "crates/sim" }
lowlat-capture = { path = "crates/capture" }
lowlat-audio = { path = "crates/audio" }
lowlat-encode = { path = "crates/encode" }
lowlat-inject = { path = "crates/inject" }
lowlat-host = { path = "crates/host" }
lowlat-kessel = { path = "crates/kessel" }

libc = "0.2"
getrandom = "0.2"

# Scanout capture. Pure ioctls through rustix, so nothing is linked or dlopened,
# and the prime export takes its flags from us rather than assuming write access.
drm = "0.15"
# Import and colour conversion. The only interface that takes a buffer's tiling
# modifier explicitly and runs one compute shader across both drivers here.
# Loaded at runtime rather than linked, so a machine without it fails at our
# call site instead of refusing to start.
ash = "0.38"
# The conversion fallback, chosen explicitly and never automatically. Same
# loading discipline as ash: resolved at runtime, so a machine without a driver
# has a backend that refuses rather than a process that will not start.
# libloading comes with it and is already in the graph behind ash, so it adds a
# name here and nothing to the build.
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"

# Signaling only. lowlat-kessel is the one crate permitted an async runtime, a
# TLS stack and a JSON parser; nothing inside the FFI boundary links it.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Exactly one TLS provider, chosen here rather than left to feature unification
# to decide, which resolves to none and panics at the first connection.
opus-rs = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
# Data-path crates additionally deny these at the crate root; see AGENTS 7.
mem_forget = "deny"
float_cmp = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
# panic stays "unwind". The shared library catches unwinding at the ABI
# boundary (docs/06-api.md 9) and "abort" would silently disable that.

[profile.bench]
lto = "fat"
codegen-units = 1
debug = true

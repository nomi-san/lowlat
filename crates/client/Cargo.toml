[package]
name = "lowlat-client"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
lowlat-common.workspace = true
lowlat-core.workspace = true
lowlat-net.workspace = true
# The offer's credentials are generated here; the core owns no generator.
lowlat-crypto.workspace = true
# The decoders, and the trait the feed drives one through.
lowlat-decode.workspace = true
lowlat-drivers.workspace = true
# The sound decoder, the same one the host reads a microphone through.
lowlat-audio.workspace = true
# The inflate under the pointer's picture.
miniz_oxide.workspace = true

[dev-dependencies]
# The hermetic session's other end: the host crate's own framing and
# negotiation, driven under the simulator against this client.
lowlat-host.workspace = true
# The host's own expansion of input into device events, so what the client
# sends is checked as the host would inject it.
lowlat-inject.workspace = true
lowlat-sim.workspace = true

[lints]
workspace = true

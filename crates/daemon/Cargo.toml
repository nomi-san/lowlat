[package]
name = "lowlatd"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "lowlatd"
path = "src/main.rs"

[dependencies]
# The logging macros, so the daemon's own lines carry the same level, the same
# timestamp and the same stream as the library's rather than being a second
# account of one run on a different file descriptor.
lowlat-common.workspace = true
lowlat-host.workspace = true
# The sound configuration its flags fill in.
lowlat-audio.workspace = true
lowlat-kessel.workspace = true
# The peer's credentials on a local socket, which std exposes only behind an
# unstable feature. Already in the graph; this is a direct edge, not a new
# dependency.
libc.workspace = true
# The translation between signaling and the seam is JSON on one side and an
# async client on the other; both stop at this boundary.
tokio.workspace = true
# The facade the browser pipe's state machines log through, bridged onto
# this program's own stream. Already in the graph behind them.
log = "0.4"
serde_json.workspace = true

[lints]
workspace = true

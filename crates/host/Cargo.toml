[package]
name = "lowlat-host"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
lowlat-common.workspace = true
lowlat-core.workspace = true
lowlat-net.workspace = true
# Credentials are generated at approval; the core owns no generator.
lowlat-crypto.workspace = true
lowlat-capture.workspace = true
# Sound: capture and the codec, in their own crate for the reason its own
# documentation gives.
lowlat-audio.workspace = true
lowlat-encode.workspace = true
lowlat-inject.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The display source names plane and format types from the capture interface.
drm.workspace = true
# The vblank poll: one fd in the loop's own wait, polled rather than slept.
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# The display builds the capture's device and names the output and texture
# types from the device seam the encoder is bound through. Already in the
# graph under both; a direct edge, not a new dependency.
lowlat-drivers.workspace = true
# The host's own display: plugged, held at its mode and bound to the host
# through the display driver's controller, which is this workspace's.
lowlat-vdd-ctl.workspace = true

[dev-dependencies]
# The allocation counter behind the per-report path's assertion.
lowlat-common = { workspace = true, features = ["alloc-counter"] }

[target.'cfg(windows)'.dev-dependencies]
# Ending the display driver's process mid-stream, in the hardware test that
# checks a reader is stranded by nothing; and a window whose pointer the
# pointer's hardware tests set, and a desktop they switch to. Already in the
# graph under the controller.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints]
workspace = true

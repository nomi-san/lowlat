[package]
name = "lowlat-host"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "lowlat"
crate-type = ["cdylib", "rlib"]

[dependencies]
lowlat-common.workspace = true
lowlat-core.workspace = true
lowlat-net.workspace = true
# Credentials are generated at approval; the core owns no generator.
lowlat-crypto.workspace = true
lowlat-capture.workspace = true
# Sound: capture and the codec, in their own crate for the reason its own
# documentation gives.
lowlat-audio.workspace = true
# The display source names plane and format types from the capture interface.
drm.workspace = true
# The vblank poll: one fd in the loop's own wait, polled rather than slept.
libc.workspace = true
lowlat-encode.workspace = true
lowlat-inject.workspace = true

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints]
workspace = true

[dev-dependencies]
# Generates the C header from these definitions, so the two cannot drift
# (docs/06-api.md 12). A dev-dependency rather than a build one: the header is
# committed, nothing on a build machine regenerates it, and a test is what
# fails when it is stale. Default features off drops the command-line parser,
# which is ten crates we would carry to call a library function.
cbindgen = { version = "0.29.4", default-features = false }

[package]
name = "lowlat-inject"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
lowlat-common.workspace = true
lowlat-core.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

# The batch input call, the desktop and display-scale state of the thread
# making it, and the pad bus's device and its requests: the system's own
# declarations, as capture and the IO shell take them.
[target.'cfg(windows)'.dependencies]
# The host's own input driver's kinds and requests (docs/11-drivers.md section 2).
lowlat-hid-proto.workspace = true
windows-sys = { version = "0.61", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    # A device of the input driver delivers from the moment raw input lists
    # it, which is what its input is held until.
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# The pad tests read a pad back the way a game does.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_XboxController"] }

[lints]
workspace = true

# How the C header is generated from the Rust definitions.
#
# The header is committed at include/lowlat.h and a test regenerates it and
# compares, so a definition that changes without the header changing fails the
# build (docs/06-api.md 12). Regenerate with:
#
#   LOWLAT_BLESS_HEADER=1 cargo test -p lowlat-host --test abi

language = "C"
# One line that every compiler in use understands, instead of a macro name an
# application can collide with.
pragma_once = true
# One header that compiles as C and as C++, which is the gate. Without this the
# C++ translation unit mangles every name and links against nothing.
cpp_compat = true
documentation_style = "cxx"
no_includes = true
sys_includes = ["stdint.h", "stdbool.h"]
after_includes = """

/// `noexcept` in C++ and nothing at all in C, so one header serves both.
///
/// **Every function here is nothrow by construction.** A panic is caught at
/// the boundary and comes back as a status, so a C++ caller emitting landing
/// pads around every call is paying for an exception that cannot arrive.
///
/// **MSVC is tested first**, because it reports `__cplusplus` as 199711L
/// unless it is asked not to, and any version of it that defines `_MSVC_LANG`
/// is a C++ compiler that has had `noexcept` for a decade.
#if defined(_MSVC_LANG) || (defined(__cplusplus) && __cplusplus >= 201103L)
#define LOWLAT_NOEXCEPT noexcept
#else
#define LOWLAT_NOEXCEPT
#endif

/// The two halves, declared unless the application says otherwise.
///
/// **A plain include declares everything.** An application built against a
/// library that carries one half defines `LOWLAT_NO_HOST` or
/// `LOWLAT_NO_CLIENT` before including this, and a call into the missing half
/// fails to compile rather than to link. `lowlat_features()` reports the same
/// two halves for the library that was actually loaded.
#if !defined(LOWLAT_NO_HOST) && !defined(LOWLAT_HOST)
#define LOWLAT_HOST
#endif
#if !defined(LOWLAT_NO_CLIENT) && !defined(LOWLAT_CLIENT)
#define LOWLAT_CLIENT
#endif"""
line_length = 88
tab_width = 4

# **`@file` is what makes the rest of the documentation visible.** A generator
# documents members of a file only when the file itself is documented, so
# without this block every function, enumeration and constant here is indexed
# as undocumented however carefully it is commented -- which is what happens to
# the header this API's shape follows.
header = """
/** @file
 * lowlat - the public C ABI.
 *
 * Generated from the Rust definitions. Do not edit; see crates/sdk/cbindgen.toml.
 */"""

[parse]
parse_deps = false

# The cargo features become the header's guards, under the same names.
[defines]
"feature = host" = "LOWLAT_HOST"
"feature = client" = "LOWLAT_CLIENT"

[export]
prefix = ""
# **Named because nothing references them.** These enumerations exist to name
# the values of configuration fields that are carried as plain integers, which
# is deliberate -- the application writes those fields, so reading one back as a
# variant would be reading whatever it wrote. Nothing being typed by them is the
# point, and it is also why they have to be asked for here.
include = ["lowlat_codec", "lowlat_chroma", "lowlat_encoder", "lowlat_rotation", "lowlat_cg_level", "lowlat_log_level", "lowlat_quality", "lowlat_transport"]

[enum]
prefix_with_name = false

[fn]
# On every declaration, because a boundary where one call could throw and
# another could not is a boundary nobody can wrap. Defined in `after_includes`.
postfix = "LOWLAT_NOEXCEPT"

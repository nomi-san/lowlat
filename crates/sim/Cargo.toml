[package]
name = "lowlat-sim"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
lowlat-common.workspace = true
lowlat-core.workspace = true
# The namespace fixtures run the real shell, not a loop that stands in for one.
lowlat-net.workspace = true
# A browser session under the simulator wants an identity for each end.
lowlat-crypto.workspace = true
# The simulated relay's long-term credentials, written from the standard
# rather than borrowed from the core. All three are in the graph already.
hmac = "0.12"
md-5 = "0.10"
sha1 = "0.10"

[lints]
workspace = true

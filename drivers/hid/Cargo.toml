[package]
name = "lowlat-hid"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The host's own input driver: a library the system's user-mode driver host
# loads (docs/11-drivers.md section 2). Built for Windows alone; elsewhere it
# is empty.
[lib]
# Built as `vhid.dll` and packaged under its brand's name, `lowlat_hid.dll` for
# lowlat's own (docs/11-drivers.md section 1.10), so a company's driver carries
# no other name inside it. No program may be named `vhid`: a program's debug
# symbols take its name, and the two would write one `vhid.pdb`.
name = "vhid"
crate-type = ["cdylib"]
# What can be tested without the driver host -- the kinds, their reports, the
# requests -- is lowlat-hid-proto's and tested there. This crate is the glue
# the frameworks call into, checked live (docs/impl-plan-windows.md W4.0).
test = false
doctest = false

[target.'cfg(windows)'.dependencies]
lowlat-common.workspace = true
lowlat-hid-proto.workspace = true
# The debugger stream the log goes to, and the driver host's class.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
] }

# The brand's names, which the build writes into the package's setup
# information.
[build-dependencies]
lowlat-brand.workspace = true

[lints]
workspace = true

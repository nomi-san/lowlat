# Excluded from the workspace: cargo-fuzz needs nightly and its own flags, and
# leaving it a member drags those into every ordinary build.
[package]
name = "lowlat-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lowlat-core = { path = "../crates/core" }
# The microphone target reaches past the wire parse into the codec, because
# that is where the bytes a guest chose actually get interpreted.
lowlat-audio = { path = "../crates/audio" }
# The browser pipe: its record layer and its association parse what a peer
# sends, and both are reached through the session that owns them.
lowlat-net = { path = "../crates/net" }
lowlat-crypto = { path = "../crates/crypto" }
# The video readers: everything a host's bitstream says is read here before
# the device sees any of it.
lowlat-decode = { path = "../crates/decode" }

[[bin]]
name = "envelope"
path = "fuzz_targets/envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "packet"
path = "fuzz_targets/packet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "control"
path = "fuzz_targets/control.rs"
test = false
